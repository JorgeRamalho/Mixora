<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function () {
        var APP = {
          mixer: 1,
          academia: 1,
          radio: 1,
          catalogo: 1,
          cadastro: 1,
          dj: 1,
          politicas: 1,
          harmonia: 1,
        };
        var path = location.pathname.replace(/\/index\.html$/i, "");
        var parts = path.split("/").filter(Boolean);
        var href = "/";
        if (parts[0] && !APP[parts[0]]) {
          href = "/" + parts[0] + "/";
        }
        var base = document.createElement("base");
        base.href = href;
        document.head.insertBefore(base, document.head.firstChild);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg?v=monogram" />
    <link rel="apple-touch-icon" href="./public/logo-mamute.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mamute DJPLAYER é o mixer player para DJs iniciantes e avançados: visor digital, simulador de CDJ e controladora, academia, rádio e catálogo Beatport, Deezer, SoundCloud, YouTube e Spotify."
    />
    <meta
      name="keywords"
      content="Mamute DJPLAYER, Mamute, DJ, mixer player, CDJ, controladora, beatmatching, Beatport, Deezer, SoundCloud, YouTube, Spotify, academia DJ, rádio eletrônica"
    />
    <meta name="author" content="Mamute DJPLAYER" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06070c" />
    <link rel="canonical" href="https://mamutedjplayerm.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mamute DJPLAYER" />
    <meta property="og:title" content="Mamute DJPLAYER — Mixer player para DJs" />
    <meta
      property="og:description"
      content="Do primeiro beat ao peak time. Visor digital, CDJ virtual, sala de aula e rádio para DJs."
    />
    <meta property="og:image" content="./public/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mamute DJPLAYER — Mixer player para DJs" />
    <meta name="twitter:image" content="./public/og.jpg" />
    <meta
      name="twitter:description"
      content="Simulador de CDJ, academia e rádio para DJs iniciantes e avançados."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@500;700;800&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="./public/mamute-mascot.png" fetchpriority="high" />
    <title>Mamute DJPLAYER — Mixer player para DJs iniciantes e avançados</title>
  </head>
  <body>
    <form name="mamute-cadastro" data-netlify="true" hidden>
      <input type="text" name="fullName" />
      <input type="text" name="artistName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="city" />
      <input type="text" name="country" />
      <textarea name="bio"></textarea>
      <input type="text" name="experienceLevel" />
    </form>
    <div id="root"></div>
    <script>
      (function () {
        var VISOR_BPM = 124;
        var BEAT_MS = 60000 / VISOR_BPM;
        var TICKER_BEATS = 192;
        document.documentElement.style.setProperty("--visor-bpm", String(VISOR_BPM));
        document.documentElement.style.setProperty(
          "--ticker-duration",
          (TICKER_BEATS * BEAT_MS) / 1000 + "s",
        );

        var rate = 1;
        var target = 1;
        var tau = 0.62;
        var last = performance.now();

        function tick(now) {
          var dt = Math.min(0.048, (now - last) / 1000);
          last = now;
          rate += (target - rate) * (1 - Math.exp(-dt / tau));
          if (target === 0 && rate < 0.02) rate = 0;
          var track = document.querySelector(".status-track");
          if (track) {
            var anims = track.getAnimations();
            for (var i = 0; i < anims.length; i += 1) {
              anims[i].playbackRate = rate;
            }
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        document.addEventListener(
          "pointerover",
          function (event) {
            var node = event.target;
            if (node && node.closest && node.closest(".status-bar")) {
              target = 0;
              tau = 0.62;
            }
          },
          true,
        );

        document.addEventListener(
          "pointerout",
          function (event) {
            var from = event.target && event.target.closest ? event.target.closest(".status-bar") : null;
            var to =
              event.relatedTarget && event.relatedTarget.closest
                ? event.relatedTarget.closest(".status-bar")
                : null;
            if (from && !to) {
              target = 1;
              tau = 0.95;
            }
          },
          true,
        );
      })();

      (function () {
        if (document.querySelector('script[src*="src/main.tsx"]')) return;
        if (document.querySelector('script[src*="assets/main.js"]')) return;

        var port = String(location.port || "");
        if (!port) return;
        if (/^517\d$/.test(port) || port === "4173" || port === "8888") return;

        var VITE_ORIGIN = "http://127.0.0.1:5173";
        var VITE_POLL_MS = 1500;
        var CSS_HREF = "./dist/assets/index.css";
        var JS_HREF = "./dist/assets/main.js";

        function viteIsReady(res) {
          if (!res.ok) return false;
          var type = res.headers.get("content-type") || "";
          if (/html/i.test(type)) return false;
          return /javascript|typescript|ecmascript|module/i.test(type) || type === "";
        }

        function withTimeout(promise, ms) {
          return new Promise(function (resolve, reject) {
            var timer = setTimeout(function () {
              reject(new Error("vite timeout"));
            }, ms);
            promise.then(
              function (value) {
                clearTimeout(timer);
                resolve(value);
              },
              function (err) {
                clearTimeout(timer);
                reject(err);
              },
            );
          });
        }

        function probeVite() {
          return withTimeout(
            fetch(VITE_ORIGIN + "/@vite/client", { cache: "no-store", mode: "cors" }).then(
              function (res) {
                if (!viteIsReady(res)) throw new Error("vite off");
              },
            ),
            800,
          );
        }

        function livePath() {
          var path = location.pathname.replace(/\/index\.html$/i, "") || "/";
          return path + location.search + location.hash;
        }

        function showPanel(html) {
          var root = document.getElementById("root");
          if (!root) return;
          if (root.querySelector("[data-mamute-app]")) return;
          root.innerHTML = html;
        }

        function showHint() {
          showPanel(
            '<section data-live-src-required style="font-family:Outfit,sans-serif;color:#e8eef8;padding:2.5rem;max-width:42rem;margin:12vh auto;background:#0c1018;border:1px solid rgba(0,232,255,.35);border-radius:18px;line-height:1.5"><p style="color:#ff2d95;letter-spacing:.24em;font-size:.7rem">MAMUTE DJPLAYER</p><h1 style="font-family:Syne,sans-serif">Go Live sem bundle</h1><p>O Live Server (porta 5500) monta o app pelo Vite em <code>src/</code> ou pelo arquivo compilado em <code>dist/</code>.</p><p>No terminal: <code>npm run live:vite</code> (hot reload) ou <code>npm run live:build</code> (gera dist/). Recarregue com <strong>Ctrl+Shift+R</strong>.</p></section>',
          );
        }

        function isRealAsset(type, text) {
          if (!text || /^\s*</.test(text)) return false;
          if (/html/i.test(type || "")) return false;
          return text.length > 20;
        }

        function injectDist(cssHref, jsHref) {
          var css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = cssHref;
          document.head.appendChild(css);

          var script = document.createElement("script");
          script.type = "module";
          script.src = jsHref;
          script.onerror = showHint;
          document.body.appendChild(script);
        }

        function tryLoadDist() {
          var cssHref = CSS_HREF + "?t=" + Date.now();
          var jsHref = JS_HREF + "?t=" + Date.now();
          return fetch(jsHref, { cache: "no-store" }).then(function (res) {
            return res.text().then(function (text) {
              var type = res.headers.get("content-type") || "";
              if (res.ok && isRealAsset(type, text)) {
                injectDist(cssHref, jsHref);
                return true;
              }
              return false;
            });
          });
        }

        var booted = false;
        function bootVite() {
          if (booted) return;
          booted = true;
          // HTML fora do Vite precisa do preamble do plugin-react, senão o app
          // quebra em branco (@vitejs/plugin-react can't detect preamble).
          // https://vitejs.dev/guide/backend-integration.html
          var boot = document.createElement("script");
          boot.type = "module";
          boot.dataset.mamuteVite = "1";
          boot.textContent =
            'import RefreshRuntime from "' +
            VITE_ORIGIN +
            '/@react-refresh";' +
            "RefreshRuntime.injectIntoGlobalHook(window);" +
            "window.$RefreshReg$ = () => {};" +
            "window.$RefreshSig$ = () => (type) => type;" +
            "window.__vite_plugin_react_preamble_installed__ = true;" +
            'await import("' +
            VITE_ORIGIN +
            '/@vite/client");' +
            'await import("' +
            VITE_ORIGIN +
            '/src/main.tsx");';
          document.head.appendChild(boot);
          if (location.hash || location.pathname.replace(/\/index\.html$/i, "")) {
            history.replaceState(null, "", livePath());
          }
        }

        function followVite() {
          probeVite()
            .then(bootVite)
            .catch(function () {
              setTimeout(followVite, VITE_POLL_MS);
            });
        }

        function followViteReload() {
          probeVite()
            .then(function () {
              location.reload();
            })
            .catch(function () {
              setTimeout(followViteReload, VITE_POLL_MS);
            });
        }

        probeVite()
          .then(bootVite)
          .catch(function () {
            tryLoadDist()
              .then(function (ok) {
                if (ok) {
                  followViteReload();
                  return;
                }
                showHint();
                followVite();
              })
              .catch(function () {
                showHint();
                followVite();
              });
          });
      })();
    </script>
  </body>
</html>
